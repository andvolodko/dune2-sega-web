<meta charset=utf-8><meta content="text/html; charset=utf-8"http-equiv=Content-Type><title>Dune II: ReArrakis Web</title><script src="../../coi-serviceworker.js"></script><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body, html { width: 100%; height: 100%; overflow: hidden; background: #000; display: flex; align-items: center; justify-content: center; }
#emscripten_logo, #controls, #status, #progress, #output, .spinner { display: none !important; }

<div class=emscripten_border><canvas class=emscripten id=canvas oncontextmenu=event.preventDefault() tabindex=-1></canvas></div>
<textarea id=output rows=8 style="display:none"></textarea>
<script>
window.__duneMuted=false;
window.__activeAudioContext=null;
var _OrigAudioContext=window.AudioContext||window.webkitAudioContext;
if(_OrigAudioContext){
  function PatchedAudioContext(opts){
    var ctx=opts?new _OrigAudioContext(opts):new _OrigAudioContext();
    window.__activeAudioContext=ctx;
    if(window.__duneMuted){try{ctx.suspend();}catch(e){}}
    return ctx;
  }
  PatchedAudioContext.prototype=_OrigAudioContext.prototype;
  try{
    if(window.AudioContext)window.AudioContext=PatchedAudioContext;
    if(window.webkitAudioContext)window.webkitAudioContext=PatchedAudioContext;
  }catch(e){}
}
window.setAudioMuted=function(mute){
  window.__duneMuted=!!mute;
  var ctx=window.__activeAudioContext||(window.Module&&window.Module.SDL2&&window.Module.SDL2.audioContext)||(window.SDL2&&window.SDL2.audioContext)||(window.SDL&&window.SDL.audioContext);
  if(ctx){
    if(mute){try{ctx.suspend();}catch(e){}}
    else{try{ctx.resume();}catch(e){}}
  }
  return window.__duneMuted;
};

var canvasElement=document.getElementById("canvas");
var outputElement=document.getElementById("output");
if(outputElement) outputElement.value="";
canvasElement.addEventListener("webglcontextlost",function(e){
  alert("WebGL context lost. Please reload the page.");
  e.preventDefault();
},!1);

canvasElement.addEventListener("mouseleave", function(){
  if (typeof Module !== "undefined" && typeof Module._dune_mouse_leave === "function") {
    Module._dune_mouse_leave();
  }
});
window.addEventListener("blur", function(){
  if (typeof Module !== "undefined" && typeof Module._dune_mouse_leave === "function") {
    Module._dune_mouse_leave();
  }
});

var setStatus=function(text){
  // Forward status to parent window
  try{
    if(window.parent&&window.parent!==window){
      window.parent.postMessage({type:'dune-status',text:text},'*');
    }
  }catch(_err){}
};

var cacheBuster = '1792602000';
var Module={
  locateFile: function(p, prefix){
    return (prefix||'')+p+'?t='+cacheBuster;
  },
  print: function(...e){
    console.log(...e);
    if(outputElement){
      outputElement.value += e.join(" ") + "\n";
      outputElement.scrollTop = outputElement.scrollHeight;
    }
  },
  canvas: canvasElement,
  setStatus: setStatus,
  instantiateWasm: function(imports, successCallback){
    var wasmUrl = Module.locateFile('dune_web.wasm');
    var xhr = new XMLHttpRequest();
    xhr.open('GET', wasmUrl, true);
    xhr.responseType = 'arraybuffer';
    xhr.onprogress = function(e){
      if(e.lengthComputable && e.total > 0){
        var pct = Math.min(92, Math.round((e.loaded / e.total) * 92));
        var loadedMB = (e.loaded / 1048576).toFixed(1);
        var totalMB = (e.total / 1048576).toFixed(1);
        try{
          if(window.parent&&window.parent!==window){
            window.parent.postMessage({
              type:'dune-status',
              text:'Downloading Sega Core (' + loadedMB + ' / ' + totalMB + ' MB)...',
              percent: pct
            },'*');
          }
        }catch(_e){}
      }
    };
    xhr.onload = function(){
      if(xhr.status === 200 || (xhr.status === 0 && xhr.response)){
        try{
          if(window.parent&&window.parent!==window){
            window.parent.postMessage({
              type:'dune-status',
              text:'Compiling WebAssembly Neural Core...',
              percent: 94
            },'*');
          }
        }catch(_e){}
        WebAssembly.instantiate(xhr.response, imports).then(function(result){
          try{
            if(window.parent&&window.parent!==window){
              window.parent.postMessage({
                type:'dune-status',
                text:'Initializing Sega 68000 & VDP Engine...',
                percent: 97
              },'*');
            }
          }catch(_e){}
          successCallback(result.instance);
        }).catch(function(err){
          console.error("WASM instantiation error:", err);
          if(window.parent&&window.parent!==window){
            window.parent.postMessage({type:'dune-status',text:'Error: '+err.message,percent:100},'*');
          }
        });
      } else {
        console.error("WASM download failed:", xhr.status);
      }
    };
    xhr.onerror = function(err){
      console.error("WASM XHR error:", err);
    };
    xhr.send(null);
  },
  onRuntimeInitialized: function(){
    try{
      if(window.parent&&window.parent!==window){
        window.parent.postMessage({type:'dune-status',text:'Initializing Sega Engine...',percent:98},'*');
      }
    }catch(_e){}
  },
  postRun: [function(){
    try{
      if(window.parent&&window.parent!==window){
        window.parent.postMessage({type:'dune-status',text:'Battlefield Ready. Good luck, Commander!',percent:100},'*');
        window.parent.postMessage({type:'dune-ready'},'*');
      }
    }catch(_e){}
  }]
};

// Savestate message handling
window.addEventListener('message', function(event){
  if(!event.data || typeof event.data !== 'object') return;
  var action = event.data.action;
  if(action === 'dune-save-state'){
    try{
      if(typeof Module._dune_save_state_to_buffer === 'function'){
        var size = Module._dune_save_state_to_buffer();
        if(size > 0){
          var ptr = Module._dune_get_save_buffer();
          var bytes = new Uint8Array(Module.HEAPU8.buffer, ptr, size);
          var binary = '';
          for(var i=0; i<size; i++){
            binary += String.fromCharCode(bytes[i]);
          }
          var b64 = btoa(binary);
          window.parent.postMessage({type:'dune-save-result',success:true,slot:event.data.slot,data:b64,size:size},'*');
        } else {
          window.parent.postMessage({type:'dune-save-result',success:false,error:'Engine not active'},'*');
        }
      }
    }catch(err){
      window.parent.postMessage({type:'dune-save-result',success:false,error:err.message},'*');
    }
  } else if(action === 'dune-load-state'){
    try{
      if(typeof Module._dune_load_state_from_buffer === 'function' && event.data.data){
        var binary = atob(event.data.data);
        var len = binary.length;
        var ptr = Module._dune_get_save_buffer();
        for(var i=0; i<len; i++){
          Module.HEAPU8[ptr + i] = binary.charCodeAt(i);
        }
        var ok = Module._dune_load_state_from_buffer(len);
        window.parent.postMessage({type:'dune-load-result',success:!!ok,slot:event.data.slot},'*');
      }
    }catch(err){
      window.parent.postMessage({type:'dune-load-result',success:false,error:err.message},'*');
    }
  } else if(action === 'dune-mouse-leave'){
    if(typeof Module !== 'undefined' && typeof Module._dune_mouse_leave === 'function'){
      Module._dune_mouse_leave();
    }
  }
});

window.onerror=window.onunhandledrejection=function(err, src, line, col, error){
  console.error("Dune Web Error:", err, error && error.stack);
};
</script>
